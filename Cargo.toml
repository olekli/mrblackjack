[package]
name = "mrblackjack"
version = "0.1.24"
authors = ["Ole Kliemann <mail@olekliemann.de>"]
edition = "2021"
license = "Apache-2.0"
description = "Simple framework for testing Kubernetes operators"
repository = "https://github.com/olekli/mrblackjack"
readme = "README.md"
keywords = ["kubernetes", "end-to-end-testing", "testing", "operator"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
env_logger = "0.11"
futures = "0.3"
k8s-openapi = { version = "0.23", features = ["v1_31"] }
kube = { version = "0.96", features = ["runtime", "derive"] }
log = "0.4"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
random_word = { version = "0.4", features = ["en"] }
fmt = "0.1"
clap = { version = "4", features = ["derive"] }
colored = "2"
once_cell = "1"
shell-words = "1"
envsubst = "0.2"
tempfile = "3"
display_json = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rstest = "0.23"

[lib]
name = "blackjack"
path = "src/lib.rs"

[[bin]]
name = "blackjack"
path = "src/bin.rs"

[[bin]]
name = "make-schema"
path = "src/make_schema.rs"
